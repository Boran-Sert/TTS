pretrained_path: /workspace/models/VoxCPM2/
train_manifest: /workspace/data/voxcpm_manifests/train.jsonl
val_manifest: /workspace/data/voxcpm_manifests/val.jsonl

sample_rate: 16000
out_sample_rate: 48000
batch_size: 2
grad_accum_steps: 8
num_workers: 2
num_iters: 2000
log_interval: 10
valid_interval: 250
save_interval: 250

learning_rate: 0.0001
weight_decay: 0.01
warmup_steps: 200
max_steps: 2000
max_batch_tokens: 8192

save_path: /workspace/checkpoints/lora
tensorboard: /workspace/logs/lora

lambdas:
  loss/diff: 1.0
  loss/stop: 1.0

lora:
  enable_lm: true
  enable_dit: true
  enable_proj: false
  r: 64
  alpha: 64
  dropout: 0.0
